name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Sync Capacitor Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          echo "### Capacitor Sync Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx cap sync android 2>&1 | tee -a $GITHUB_STEP_SUMMARY || echo "Capacitor sync completed with notes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Presensi-GTK.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Presensi-GTK-APK
          path: Presensi-GTK.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: apk-latest
          name: "Presensi GTK APK (Latest Build)"
          body: |
            ### 📱 Download APK Presensi GTK Terbaru
            File APK siap di-install di smartphone Android:
            - **Nama File**: `Presensi-GTK.apk`
            - **Commit**: ${{ github.sha }}
            - **Tanggal Build**: ${{ github.event.head_commit.timestamp }}
          files: Presensi-GTK.apk

